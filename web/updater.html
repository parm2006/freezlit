<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Update Freezlit</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="updater.css"></head>
<body><main class="updater"><h1>Freezlit updates</h1><p id="version" class="small">Keep your study space up to date.</p><h2 id="heading">Checking for updates…</h2><p id="status" role="status" aria-live="polite">Connecting to GitHub.</p><progress id="progress" max="100" value="0" aria-label="Update download" hidden></progress><div class="row"><button id="action" class="primary" disabled>Checking…</button></div><p class="small data-note">Your decks, images and study progress stay on this computer.</p></main><script src="updater.js"></script></body></html>
